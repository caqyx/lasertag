<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laser Tag Arena</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2305030a'/%3E%3Ccircle cx='8' cy='8' r='4.5' fill='none' stroke='%2322e8ff' stroke-width='1.6'/%3E%3Ccircle cx='8' cy='8' r='1.3' fill='%23ff2bd6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="src/ui/hud.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <canvas id="game" tabindex="-1"></canvas>

  <div id="hud" aria-hidden="true">
    <div class="crosshair">
      <span class="ch-line ch-t"></span>
      <span class="ch-line ch-b"></span>
      <span class="ch-line ch-l"></span>
      <span class="ch-line ch-r"></span>
      <span class="ch-dot"></span>
    </div>
  </div>

  <div id="start" class="overlay" role="button" tabindex="0">
    <div class="start-card">
      <h1 class="title">LASER<span>TAG</span></h1>
      <p class="cta" id="start-cta">Kliknij, aby grać</p>
      <p class="keys">WASD ruch &middot; Mysz celowanie &middot; LPM strzał &middot; Shift sprint &middot; Spacja skok &middot; Esc pauza</p>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
